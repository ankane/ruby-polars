name: build
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # - ruby: "4.0"
          #   os: ubuntu-latest
          - ruby: "4.0"
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tmp
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # https://github.com/oxidize-rb/rb-sys/issues/268
      - if: ${{ runner.os == 'Windows' }}
        run: echo "RUST_TARGET=x86_64-pc-windows-gnu" >> "$env:GITHUB_ENV"
      - run: bundle exec rake compile
      - run: bundle exec rake test
      - run: bundle exec yard --fail-on-warning
      - run: bundle exec rake test:docs

      - uses: ankane/setup-postgres@v1
        with:
          database: polars_ruby_test
      - run: ruby test/database_test.rb
        env:
          ADAPTER: postgresql

      - if: ${{ runner.os != 'Windows' }}
        uses: ankane/setup-mysql@v1
        with:
          database: polars_ruby_test
      - if: ${{ runner.os != 'Windows' }}
        run: ruby test/database_test.rb
        env:
          ADAPTER: mysql
      - if: ${{ runner.os != 'Windows' }}
        run: ruby test/database_test.rb
        env:
          ADAPTER: trilogy
